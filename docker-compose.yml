# Personal AI Agent Workspace - Development Environment
# One command: docker compose up --build

services:

  # ─── Backend: FastAPI with auto-reload ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-backend
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for uvicorn --reload to detect changes
      - ./backend/app:/app/app
      # Persistent SQLite storage (use a Docker named volume on Windows to avoid
      # host filesystem locking / permission issues with SQLite WAL)
      - backend_data:/app/data
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LLM_PROVIDER=tongyi
      - DEFAULT_MODEL=qwen-turbo
      - TONGYI_API_KEY=sk-2c82baff516a4ff38a0b786b42f8e0db
      - TONGYI_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - DATABASE_PATH=/app/data/workflows.db
      - PYTHONDONTWRITEBYTECODE=1
      - APP_LOCALE=zh_HK
    depends_on:
      - ollama
    networks:
      - workspace-net

  # ─── Frontend: Next.js dev server with hot reload ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ai-frontend
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source for Next.js fast refresh
      - ./frontend:/app
      # Preserve container node_modules so host bind doesn't override them
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - workspace-net

  # ─── Ollama: Local LLM ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persistent model storage (won't re-download on restart)
      - ollama_models:/root/.ollama
    networks:
      - workspace-net

  # ─── Ollama model pull (one-shot init) ───────────────────
  # Waits for Ollama to be ready, then pulls the required model.
  # Safe to re-run — Ollama skips the download if already present.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ai-ollama-init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo "Ollama ready. Pulling qwen2.5:3b..."
        ollama pull qwen2.5:3b
        echo "Model pull complete."
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      - ollama
    networks:
      - workspace-net

volumes:
  ollama_models:
  backend_data:

networks:
  workspace-net:
    driver: bridge