apiVersion: batch/v1
kind: CronJob
metadata:
  name: runtime-dr-snapshot
  labels:
    app: autonomous-ai-operator
    component: disaster-recovery
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: dr-snapshot
              image: autonomous-ai-operator:latest
              command:
                - curl
                - -X
                - POST
                - http://autonomous-ai-backend:8000/api/infrastructure/dr/snapshot
